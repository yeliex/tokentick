name: Release TokenTick

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: tokentick-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate version and signing configuration
        env:
          VERSION: ${{ github.ref_name }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$SPARKLE_KEY"
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          xcodebuild -version
      - name: Configure signing and notarization
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/tokentick-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN"
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials tokentick-notary --keychain "$KEYCHAIN" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          rm "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
      - name: Build and verify app and CLI
        id: package
        env:
          VERSION: ${{ github.ref_name }}
          TOKENTICK_NOTARY_PROFILE: tokentick-notary
        run: ./script/package_release.sh "${VERSION#v}" "$GITHUB_RUN_NUMBER"
      - name: Preserve release debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: release-debug-symbols
          path: .build/ReleaseDerivedData/Build/Products/Release/TokenTick.app.dSYM
          if-no-files-found: error
          retention-days: 90
      - name: Upload Sentry debug symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: yeliex
          SENTRY_PROJECT: tokentick
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not configured; debug symbols are retained as a workflow artifact."
            exit 0
          fi
          brew install getsentry/tools/sentry-cli
          sentry-cli debug-files upload --wait .build/ReleaseDerivedData/Build/Products/Release/TokenTick.app.dSYM
      - name: Generate release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./script/generate_release_notes.sh "$VERSION" > .build/release-notes.md
          test -s .build/release-notes.md
      - name: Generate signed appcast
        env:
          TOKENTICK_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          UPDATE_ARCHIVE: ${{ steps.package.outputs.update_archive }}
        run: ./script/generate_appcast.sh "$UPDATE_ARCHIVE" .build/release-notes.md .build/appcast
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          RELEASE_DIRECTORY: ${{ steps.package.outputs.release_directory }}
        run: |
          gh release create "$VERSION" "$RELEASE_DIRECTORY"/*.zip "$RELEASE_DIRECTORY"/*.sha256 \
            .build/appcast/appcast.xml --verify-tag --latest \
            --title "TokenTick ${VERSION#v}" --notes-file .build/release-notes.md
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: .build/logs/
      - name: Remove signing credentials
        if: always()
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
          security delete-keychain "$RUNNER_TEMP/tokentick-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
